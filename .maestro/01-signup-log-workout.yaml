# 신규 가입 → 운동 시작 → 세트 2개 → 완료 → 기록/통계 반영 확인
appId: host.exp.Exponent
name: 가입하고 운동 기록하기
tags: [smoke]
---
- evalScript: ${output.email = 'e2e-' + Date.now() + '@fitlog.test'}
- runFlow: subflows/open-app.yaml

- tapOn:
    id: "auth-mode-toggle"
- tapOn:
    id: "email-input"
- inputText: ${output.email}
- tapOn:
    id: "password-input"
- inputText: "e2e-password-1"
- tapOn:
    id: "auth-submit"
- runFlow:
    when:
      visible: "지금 안 함"
    commands:
      - tapOn: "지금 안 함"

# 새 사용자: 빈 상태
- assertVisible: "오늘 운동할 준비 되셨나요?"
- assertVisible: "완료한 운동이 아직 없어요."
- runFlow:
    file: subflows/set-unit.yaml
    env:
      UNIT: kg

# 운동 시작 → 벤치프레스 20kg 기본값에서 +2.5 두 번 = 25kg × 10
- tapOn:
    id: "start-workout-button"
- assertVisible: "종목 선택"
- tapOn: "벤치프레스"
- tapOn:
    id: "weight-input-inc"
- tapOn:
    id: "weight-input-inc"
- tapOn:
    id: "add-set-button"
# 세트 카드는 Pressable 이라 자식 텍스트가 하나의 접근성 요소로 합쳐진다 → 정규식으로 매칭
- assertVisible: ".*1세트 · 250kg.*25kg × 10회.*"
# 다음 세트는 직전 값으로 프리필
- tapOn:
    id: "add-set-button"
- assertVisible: ".*2세트 · 500kg.*"

- tapOn:
    id: "finish-workout-button"
- assertVisible: "최근 운동"
- assertVisible: ".*2세트 · 500kg.*"

# 통계: 추정 1RM = 25 × (1 + 10/30) = 33.3kg
- tapOn:
    id: "tab-stats"
- assertVisible: "종목별 최고 기록 (추정 1RM)"
- assertVisible: "33.3kg"

# 기록 탭에 1건
- tapOn:
    id: "tab-history"
- assertVisible: "전체 1개 기록"
